<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDOR Defense Lab - Security Testing Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --secondary: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #0f172a;
            --light: #f8fafc;
            --background: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--background);
            color: #e2e8f0;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            background: linear-gradient(90deg, var(--dark) 0%, #1a2942 100%) !important;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--primary) !important;
            letter-spacing: -0.5px;
        }

        .navbar-brand i {
            margin-right: 8px;
        }

        .nav-link {
            color: #cbd5e1 !important;
            font-weight: 500;
            transition: color 0.3s ease;
            margin: 0 8px;
        }

        .nav-link:hover {
            color: var(--primary) !important;
        }

        .btn-logout {
            background: linear-gradient(135deg, var(--danger) 0%, #dc2626 100%);
            border: none;
            color: white;
            padding: 6px 16px;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        /* Login Container */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-form {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .login-form h2 {
            color: var(--primary);
            margin-bottom: 10px;
            font-weight: 700;
            font-size: 1.8rem;
        }

        .login-form .form-text {
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        /* Form Controls */
        .form-control, .form-select {
            background: #0f172a;
            border: 1px solid var(--border);
            color: #e2e8f0;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            background: #0f172a;
            border-color: var(--primary);
            color: #e2e8f0;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-control::placeholder {
            color: #64748b;
        }

        .form-label {
            color: #cbd5e1;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
            background: linear-gradient(135deg, var(--primary-dark) 0%, #1e40af 100%);
        }

        .btn-primary:focus {
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            background: rgba(37, 99, 235, 0.1);
            border-bottom: 1px solid var(--border);
            color: var(--primary);
            font-weight: 600;
        }

        .card-body {
            padding: 24px;
        }

        .card-title {
            color: #e2e8f0;
            font-weight: 600;
            margin-bottom: 16px;
            font-size: 1.1rem;
        }

        /* Document Cards */
        .document-card {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.05) 0%, rgba(37, 99, 235, 0.02) 100%);
            border: 1px solid rgba(37, 99, 235, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }

        .document-card:hover {
            border-color: var(--primary);
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.1) 0%, rgba(37, 99, 235, 0.05) 100%);
            box-shadow: 0 8px 16px rgba(37, 99, 235, 0.15);
            transform: translateY(-2px);
        }

        .document-card.danger {
            border-color: rgba(239, 68, 68, 0.3);
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.05) 0%, rgba(239, 68, 68, 0.02) 100%);
        }

        .document-card.danger:hover {
            border-color: var(--danger);
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1) 0%, rgba(239, 68, 68, 0.05) 100%);
            box-shadow: 0 8px 16px rgba(239, 68, 68, 0.15);
        }

        .document-card.warning {
            border-color: rgba(245, 158, 11, 0.3);
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.05) 0%, rgba(245, 158, 11, 0.02) 100%);
        }

        .document-card.warning:hover {
            border-color: var(--warning);
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1) 0%, rgba(245, 158, 11, 0.05) 100%);
            box-shadow: 0 8px 16px rgba(245, 158, 11, 0.15);
        }

        .document-card h5 {
            color: #f1f5f9;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 1.05rem;
        }

        .document-card p {
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #cbd5e1;
        }

        .document-card .doc-id {
            color: var(--primary);
            font-weight: 600;
        }

        .document-card .doc-owner {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(148, 163, 184, 0.2);
        }

        /* Alerts */
        .alert {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        .alert-info {
            background: rgba(37, 99, 235, 0.1);
            border-color: rgba(37, 99, 235, 0.3);
            color: #93c5fd;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: #86efac;
        }

        .alert-warning {
            background: rgba(245, 158, 11, 0.1);
            border-color: rgba(245, 158, 11, 0.3);
            color: #fcd34d;
        }

        .alert-danger {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        /* Tabs */
        .nav-tabs {
            border-bottom: 1px solid var(--border);
        }

        .nav-tabs .nav-link {
            color: #94a3b8;
            border: none;
            padding: 12px 16px;
            font-weight: 500;
            border-radius: 8px 8px 0 0;
            transition: all 0.3s ease;
            margin-bottom: 0;
            margin-right: 4px;
        }

        .nav-tabs .nav-link:hover {
            color: var(--primary);
            background: rgba(37, 99, 235, 0.1);
        }

        .nav-tabs .nav-link.active {
            color: var(--primary);
            background: rgba(37, 99, 235, 0.15);
            border-bottom: 3px solid var(--primary);
        }

        /* Badge */
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-danger {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .badge-warning {
            background: rgba(245, 158, 11, 0.2);
            color: #fcd34d;
        }

        /* Code block */
        .code-block {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #86efac;
            overflow-x: auto;
            line-height: 1.5;
        }

        /* Container */
        .container {
            max-width: 1200px;
            padding: 0 20px;
        }

        /* Utilities */
        .text-muted {
            color: #94a3b8 !important;
        }

        .text-primary {
            color: var(--primary) !important;
        }

        .text-danger {
            color: var(--danger) !important;
        }

        .text-warning {
            color: var(--warning) !important;
        }

        .text-success {
            color: var(--success) !important;
        }

        .spinner-border {
            border-color: rgba(37, 99, 235, 0.3);
            border-right-color: var(--primary);
        }

        /* Main Content */
        .main-content {
            padding-top: 30px;
            padding-bottom: 50px;
        }

        .page-header {
            margin-bottom: 40px;
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 8px;
        }

        .page-header .lead {
            color: #94a3b8;
            font-size: 1.05rem;
        }

        /* Button Groups */
        .btn-group-vertical {
            gap: 8px;
        }

        .btn-group-vertical .btn-check + .btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: #cbd5e1;
        }

        .btn-group-vertical .btn-check:checked + .btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-color: var(--primary);
            color: white;
        }

        /* Textarea */
        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        /* Loading state */
        .is-loading {
            opacity: 0.6;
            pointer-events: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .login-form {
                padding: 30px 20px;
            }

            .page-header h1 {
                font-size: 1.5rem;
            }

            .navbar-brand {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
